    if (kind === 'match') { const ts = shuffle(pool.terms).slice(0, 6); Object.assign(g, { left: shuffle(ts.map(t => ({ k: t.id, text: t.term }))), right: shuffle(ts.map(t => ({ k: t.id, text: t.def }))), matched: {}, sel: null, wrong: 0, start: Date.now() }); }
    else if (kind === 'fill') Object.assign(g, { items: shuffle(pool.cloze).slice(0, 8).map(c => ({ cardId: c.id, ideaTitle: c.ideaTitle, answer: c.cloze.answer, blanked: c.cloze.sentence.replace(new RegExp(c.cloze.answer.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '_____') })), i: 0, input: '', checked: false, score: 0 });
    else if (kind === 'speed') Object.assign(g, { ids: shuffle(pool.quick).map(c => c.id), i: 0, shown: false, score: 0, missed: 0, start: 0 });
    else {
      const cols = unitsOf(cid).filter(u => u.status === 'ready').map(u => ({ title: u.title, cells: shuffle(pool.quick.filter(c => c.unitId === u.id)).slice(0, 5).sort((a, b) => (a.difficulty || 2) - (b.difficulty || 2)).map((c, i) => ({ id: c.id, pts: (i + 1) * 100, state: null })) })).filter(col => col.cells.length).slice(0, 5);
      Object.assign(g, { cols, open: null, shown: false, score: 0 });
    }
    go('games-' + cid); render();
  },
  'game-quit': () => { const cid = UI.game && UI.game.cid; UI.game = null; if (cid) go('games-' + cid); else render(); },
  'match-pick': async el => {
    const g = UI.game, side = el.dataset.side, k = el.dataset.k; g.bad = null;
    if (!g.sel || g.sel.side === side) { g.sel = { side, k }; render(); return; }
    if (g.sel.k === k) { g.matched[k] = true; g.sel = null; gameResult(null, true, g.cid); }
    else { g.wrong++; g.bad = { [side]: k, [g.sel.side]: g.sel.k }; const term = S.glossary[side === 'l' ? k : g.sel.k]; g.sel = null; gameResult(null, false, g.cid, term && term.ideaTitle); }
    if (g.left.every(x => g.matched[x.k])) { g.done = true; g.ms = Date.now() - g.start; g.isBest = await gameBest('match-' + g.cid, Math.round(g.ms / 1000), true); }
    render();
  },
  'fill-check': async () => { const g = UI.game, it = g.items[g.i]; g.ok = L.clozeMatch(g.input, it.answer); g.checked = true; if (g.ok) g.score++; render(); },
  'fill-override': () => { const g = UI.game; if (!g.ok) { g.ok = true; g.score++; g.overridden = true; } render(); },
  'fill-next': async () => {
    const g = UI.game, it = g.items[g.i];
    await gameResult(it.cardId, g.ok, g.cid);
    g.i++; g.input = ''; g.checked = false; g.ok = false;
    if (g.i >= g.items.length) { g.done = true; g.isBest = await gameBest('fill-' + g.cid, g.score, false); }
    render();
  },
  'speed-go': () => { const g = UI.game; g.start = Date.now(); g.end = g.start + 60000; render(); },
  'speed-show': () => { UI.game.shown = true; render(); },
  'speed-mark': el => { const g = UI.game, ok = el.dataset.ok === '1'; gameResult(g.ids[g.i], ok, g.cid); if (ok) g.score++; else g.missed++; g.i = (g.i + 1) % g.ids.length; g.shown = false; render(); },
  'board-open': el => { const g = UI.game; g.open = [+el.dataset.c, +el.dataset.r]; g.shown = false; render(); },
  'board-show': () => { UI.game.shown = true; render(); },
  'board-mark': async el => {
    const g = UI.game, cell = g.cols[g.open[0]].cells[g.open[1]], ok = el.dataset.ok === '1';
    cell.state = ok; if (ok) g.score += cell.pts; g.open = null;
    await gameResult(cell.id, ok, g.cid);
    if (g.cols.every(col => col.cells.every(x => x.state != null))) g.isBest = await gameBest('board-' + g.cid, g.score, false);
    render();
  }
});
async function tickGame() {
  const g = UI.game; if (!g || S.route !== 'games' || g.done) return;
  const el = $('#game-clock');
  if (g.kind === 'match' && el) el.textContent = fmtClock((Date.now() - g.start) / 1000);

}

/* ---------- Tutor: always available; current course first, then everything; general knowledge labeled ---------- */
function currentCourseId() {
  const p = S.param;
  if (S.courses[p]) return p;
  if (S.units[p]) return S.units[p].courseId;
  const m = /^(.+)L\d+$/.exec(p || ''); if (m && S.units[m[1]]) return S.units[m[1]].courseId;
  if (UI.item && S.cards[UI.item.cardId]) return S.cards[UI.item.cardId].courseId;
  return null;
}
async function tutorMaterial(cid, question) {
  const q = L.tokens(question), parts = []; let size = 0;
  const rank = scope => {
    const ideas = list('cards').filter(c => c.type === 'teachback' && (!scope || c.courseId === scope)).map(c => ({ w: L.overlap(q, L.tokens(c.ideaTitle + ' ' + c.answer)), text: `=== Lesson idea: ${c.ideaTitle} ===\n${c.answer}\nKey points: ${(c.rubric || []).join('; ')}` }));
    const segs = list('sources').filter(s => !scope || s.courseId === scope).flatMap(s => (s.digest || []).map(d => ({ w: L.overlap(q, L.tokens(d.summary)), ref: d.ref, title: s.title })));
    return { ideas: ideas.filter(x => x.w > 0.12).sort((a, b) => b.w - a.w).slice(0, 4), segs: segs.filter(x => x.w > 0.12).sort((a, b) => b.w - a.w).slice(0, 3) };
  };
  let r = rank(cid);
  if (cid && !r.ideas.length && !r.segs.length) r = rank(null);
  for (const x of r.ideas) { parts.push(x.text); size += x.text.length; }
  for (const x of r.segs) { const t = await unitMaterial({ segs: [x.ref] }, 12000); if (t && size + t.length < 40000) { parts.push(`=== Your material: ${x.title} ===\n${t}`); size += t.length; } }
  return parts.join('\n\n');
}
function tutorHtml() {
  const t = S.tutor, cid = currentCourseId(), c = cid && S.courses[cid];
  if ((S.route === 'test' && UI.test && UI.test.phase === 'run') || ((S.route === 'add' || S.route === 'newcourse') && !t.open)) return '';
  if (!t.open) return `<button type="button" class="btn primary fab" data-act="tutor-open">${icon('chat')}<span>Tutor</span></button>`;
  const cfg = settingsFor();
  return `<div class="drawer" id="drawer" role="dialog" aria-label="Tutor"><div class="row between"><h3>Tutor</h3><div class="row">${Voice.canSpeak() ? `<button class="btn sm ghost" data-act="voice-mute" aria-pressed="${cfg.voiceOn === false}">${icon(cfg.voiceOn === false ? 'x' : 'sound')}<span>${cfg.voiceOn === false ? 'Muted' : 'Voice on'}</span></button>` : ''}<button class="btn sm ghost" data-act="tutor-close">Close</button></div></div>
  <p class="small muted">${c ? `Answers from "${esc(c.title)}" first, then your other material.` : 'Answers from your material first.'} Anything else is labeled as general knowledge.</p>
  ${aiOn() ? `<div class="tutor"><div class="msgs" id="tutor-msgs">${t.turns.length ? t.turns.map(m => m.role === 'user' ? `<div class="me">${esc(m.content)}</div>` : `<div class="bot">${partsHtml(m.parts)}</div>`).join('') : '<p class="small muted">Ask about anything you\'re studying. The tutor knows your recent mistakes.</p>'}${busyHtml('tutor')}</div>
  <div class="stack tight"><textarea id="f-tutorIn" data-bind="tutorIn" rows="2" placeholder="${c ? 'Ask about this course' : 'Ask about anything you\'ve added'}" ${isBusy('tutor') ? 'disabled' : ''}>${esc(ui('tutorIn', ''))}</textarea><div class="row between"><div class="row">${micBtn('f-tutorIn')}${t.turns.length ? '<button class="btn sm ghost" data-act="tutor-clear">New chat</button>' : ''}</div><button class="btn primary" data-act="tutor-send" ${isBusy('tutor') ? 'disabled' : ''}>Ask</button></div>${micHint()}</div></div>` : `<p>${needAI}</p>`}</div>`;
}
async function tutorSend() {
  const t = S.tutor, msg = L.str(UI.tutorIn, 2000); if (!msg || isBusy('tutor')) return;
  const cid = currentCourseId();
  t.turns.push({ role: 'user', content: msg }); UI.tutorIn = '';
  const r = await task('tutor', 'Thinking…', async signal => {
    const material = await tutorMaterial(cid, msg);
    const weak = list('mistakes').filter(m => !cid || m.courseId === cid).sort((a, b) => b.at - a.at).slice(0, 8).map(m => m.ideaTitle || m.prompt.slice(0, 80));
    const convo = t.turns.slice(-8).map(m => ({ role: m.role, content: m.role === 'user' ? m.content : (m.parts || []).map(p => (p.from === 'general' ? '[general] ' : '[source] ') + p.text).join('\n') }));
    while (convo.length && convo[0].role !== 'user') convo.shift();
    convo[0] = { role: 'user', content: P.tutor({ course: cid ? S.courses[cid] : null, material, mistakes: [...new Set(weak)] }) + '\n\nLEARNER: ' + convo[0].content };
    return ai(convo, { signal });
  });
  if (!r) { const last = t.turns.pop(); UI.tutorIn = last ? last.content : ''; render(); return; }
  const parts = L.arr(r.parts, 6).map(p => ({ from: p && p.from === 'source' ? 'source' : 'general', text: L.str(p && p.text, 3000) })).filter(p => p.text);
  t.turns.push({ role: 'assistant', parts: parts.length ? parts : [{ from: 'general', text: 'No answer came back. Try rephrasing.' }] });
  render();
  if (Voice.on() && parts.length) Voice.speak(parts.map(p => p.text), 'tutor');
}

  const idea = les && r.idea != null ? les.ideas[r.idea] : null;
  return { unit, where: [unit && unit.title, idea && idea.title].filter(Boolean).join(' · ') };
}
function reportText(r) {
  const t = reportTarget(r), k = r.cardId && S.cards[r.cardId];

}

  </div><div class="stack">
    ${feedbackRow('', true)}
    ${weak.length ? `<div class="panel stack"><h3>Ideas you keep missing</h3><div class="list">${weak.map(i => `<div><b>${esc(i.title || 'Idea')}</b><div class="small muted">${esc((S.units[i.unitId] || {}).title || '')}</div></div>`).join('')}</div><a class="small" href="#notebook">Open the mistake notebook</a></div>` : ''}
    ${inbox ? `<div class="panel row between"><div class="grow"><b>${plural(inbox, 'item')} from chat</b><div class="small muted">Waiting under Add learning, "From chat".</div></div><a class="btn sm" href="#add">Open</a></div>` : ''}
    ${open ? `<div class="panel row between"><div class="grow"><b>${plural(open, 'flagged item')}</b><div class="small muted">Waiting for your look.</div></div><a class="btn sm" href="#reports">Reports</a></div>` : ''}
  </div></div></div>`;
};

/* ---------- More and Settings ---------- */
VIEWS.more = () => VIEWS.weekly();
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
VIEWS.prefs = () => {
  const g = settingsFor(), bk = ui('bk', () => ({ erase: false, file: null, note: '' }));
  return `<div class="reader stack-lg">${backLink('home', 'Today')}<div class="stack"><h1>Settings</h1><p class="muted">Defaults for every course. A course can override strictness, probing and retention under its More tools, Course options.</p></div>
  <div class="panel stack"><h3>Teach-back</h3>
    <div class="field"><span>Probing depth</span>${seg('probing', PROBING, g.probing, 'pref')}<span class="small muted">How many follow-up questions before scoring. Deep adds edge cases and "why" chains.</span></div>
    <div class="field"><span>Grading strictness</span>${seg('strictness', STRICTNESS, g.strictness, 'pref')}<span class="small muted">Pass mark for a unit: lenient 60, standard 70, strict 80.</span></div></div>
  <div class="panel stack"><h3>Model for building courses</h3><p class="small muted">Used when Claude files what you paste, writes lessons, runs the self-check and writes study guides. Grading, hints and the tutor keep the standard model so they stay quick.</p>
    ${modelPicker()}
    ${aiOn() ? `<div class="row"><button class="btn sm" data-act="model-test" ${isBusy('modeltest') ? 'disabled' : ''}>Test this choice</button>${UI.modelTest ? `<span class="small muted">${esc(UI.modelTest)}</span>` : ''}</div>${busyHtml('modeltest')}` : ''}</div>
  <div class="panel stack"><h3>Review schedule</h3>
    <div class="field"><span>Target retention</span>${seg('retention', [['0.85', '85%'], ['0.9', '90%'], ['0.93', '93%'], ['0.95', '95%']], String(g.retention), 'pref')}<span class="small muted">The chance you still remember a card when it comes due. Higher means more frequent reviews. The daily cap stays ${L.CAP} units, and the study day resets at 3 a.m.</span></div>
    <div class="field"><span>Weekly rest days</span><div class="seg" role="group">${DAYS.map((d, i) => `<button type="button" data-act="pref-rest" data-d="${i}" aria-pressed="${g.restDays.includes(i)}">${d}</button>`).join('')}</div><span class="small muted">Rest days don't break your streak. Their due cards roll to the next day.</span></div></div>
  <div class="panel stack"><h3>Voice</h3><p class="small muted">${S.tts ? 'Claude\'s voice is available here.' : Voice.canSpeak() ? 'Claude\'s voice isn\'t offered in this app or browser, so your device\'s built-in voice is used.' : 'No voice output is available in this view.'} ${S.dict ? 'The in-page mic is available.' : 'The in-page mic isn\'t offered here (it is absent in the Claude phone and desktop apps); use the mic key on your keyboard.'}</p>
    <div class="field"><span>Spoken follow-ups and tutor replies</span>${seg('voiceOn', [['true', 'On'], ['false', 'Muted']], String(g.voiceOn !== false), 'pref')}</div>
    ${S.tts ? `<div class="field"><span>Claude voice</span>${seg('voiceName', [['buttery', 'Buttery'], ['airy', 'Airy'], ['glassy', 'Glassy'], ['rounded', 'Rounded']], g.voiceName, 'pref')}</div>` : ''}
    <div class="field"><span>Speed</span>${seg('voiceRate', [['0.8', 'Slow'], ['1', 'Normal'], ['1.2', 'Fast'], ['1.4', 'Faster']], String(g.voiceRate), 'pref')}</div>
    ${Voice.canSpeak() ? `<div>${speakBtn('voice-test', 'Test the voice', 'This is how lessons and follow-up questions will sound.')}</div>` : ''}</div>
  <div class="panel stack"><h3>New courses</h3><div class="field"><span>Default syllabus sources</span>${[['outline', 'An official outline I paste'], ['own', 'My own material'], ['ai', 'Claude\'s knowledge fills gaps']].map(([k, l]) => `<label class="tick"><input type="checkbox" id="mix-${k}" data-act-change="pref-mix" data-k="${k}" ${g.mix[k] !== false ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
    <div class="field"><span>Material sources to offer</span>${[['paste', 'Paste'], ['vault', 'Obsidian vault'], ['drive', 'Google Drive'], ['notion', 'Notion']].map(([k, l]) => `<label class="tick"><input type="checkbox" id="src-${k}" data-act-change="pref-src" data-k="${k}" ${g.sources[k] !== false ? 'checked' : ''}><span>${l}${k !== 'paste' && (!S.mcp || S.conn[k] === 'off') ? ' <span class="muted">(not connected in this view)</span>' : ''}</span></label>`).join('')}<span class="small muted">Files, photos and chat hand-off are always offered.</span></div></div>
  <div class="panel stack"><h3>Backup</h3><p class="small muted">One file with every course, lesson, card, your progress and settings. Keep a copy somewhere safe.</p>
    <div class="row"><button class="btn" data-act="backup-make" ${isBusy('backup') ? 'disabled' : ''}>Back up everything</button></div>
    <div class="field"><span>Restore from a backup file</span><input type="file" id="bk-file" accept=".json,application/json" data-act-change="backup-file"></div>
    ${bk.file ? `<div class="flag stack tight"><b>${esc(bk.note)}</b><label class="tick"><input type="checkbox" id="bk-erase" data-bind="bk.erase" ${bk.erase ? 'checked' : ''}><span>Erase what is here first, so the page matches the backup exactly</span></label><span class="small">${bk.erase ? 'Everything not in the backup is deleted. This can\'t be undone.' : 'Items in the backup overwrite items with the same id. Everything else stays.'}</span><div class="row"><button class="btn primary" data-act="backup-restore" ${isBusy('backup') ? 'disabled' : ''}>Restore now</button><button class="btn ghost" data-act="backup-cancel">Cancel</button></div></div>` : bk.note ? `<div class="small muted">${esc(bk.note)}</div>` : ''}${busyHtml('backup')}</div>
  <div class="panel stack tight"><h3>Sharing and reminders</h3><p class="small">Your data is visible only to you. To stop the page itself opening for others, set sharing to private from the artifact's Share menu.</p><p class="small">A daily phone reminder is set up outside this page: ask Claude in a chat to schedule one at the time you want.</p></div></div>`;
};
function modelPicker() {
  const g = settingsFor(), cur = L.BUILD_MODELS.find(m => m.key === g.buildModel) || L.BUILD_MODELS[1];
  return `<div class="field"><span>Model</span>${seg('buildModel', L.BUILD_MODELS.map(m => [m.key, m.label]), g.buildModel, 'pref')}<span class="small muted">${esc(cur.hint)}</span></div>
    ${g.buildModel === 'other' ? field('Model id', `<input type="text" id="pref-model-id" value="${esc(g.buildModelId)}" maxlength="64" placeholder="claude-opus-5-5" data-act-change="pref-model-id" autocomplete="off" spellcheck="false">`, 'A Claude API model id, for example claude-sonnet-5-5. Use "Test this choice" in Settings to see which model actually answers.') : ''}`;
}
async function savePref(changes) { await put('settings', 'global', Object.assign({}, globalSettings(), changes)).catch(() => { }); render(); }
Object.assign(ACT, {
  'pref': el => { const k = el.dataset.key, v = el.dataset.val; if (k === 'buildModel') UI.modelTest = ''; savePref({ [k]: k === 'retention' || k === 'voiceRate' ? Number(v) : k === 'voiceOn' ? v === 'true' : v }); if (k === 'voiceOn' && v !== 'true') Voice.stop(); },
  'pref-model-id': el => { const v = el.value.trim().toLowerCase().slice(0, 64); UI.modelTest = ''; savePref({ buildModelId: v }); },
  'model-test': async () => {
    const g = settingsFor(), o = Object.assign({ cache: false }, L.modelOpts(g.buildModel, g.buildModelId));
    UI.modelTest = '';
    const r = await task('modeltest', 'Asking the model…', signal => S.sample('Reply with the single word OK.', Object.assign({ signal }, o)));
    if (r) { UI.modelTest = r.modelApplied ? `Answered by ${r.modelApplied}.` : `${o.model ? 'That model could not answer here, so the ' : 'Answered by the '}${{ quick: 'fast', default: 'balanced', complex: 'most capable' }[r.modelTierApplied] || 'standard'} tier ${o.model ? 'answered instead' : ''}.`.replace(' .', '.'); render(); }
  },
  'pref-rest': el => { const d = +el.dataset.d, cur = settingsFor().restDays; savePref({ restDays: cur.includes(d) ? cur.filter(x => x !== d) : cur.concat(d).sort() }); },
  'pref-mix': el => savePref({ mix: Object.assign({}, settingsFor().mix, { [el.dataset.k]: el.checked }) }),
  'pref-src': el => savePref({ sources: Object.assign({}, settingsFor().sources, { [el.dataset.k]: el.checked }) }),
  'backup-make': async () => {
    const data = await task('backup', 'Collecting your data…', async () => JSON.stringify(await buildBackup()));
    if (data) await offerFile('context-window-backup-' + today() + '.json', data, data.length > 400000 ? 'This backup is too large to copy by hand. Open the page in a browser on your computer to save it as a file.' : data);
  },
  'backup-file': async el => {
    const f = el.files && el.files[0], bk = UI.bk; if (!f) return;
    try { const obj = JSON.parse(await f.text()), ck = checkBackup(obj); if (!ck.ok) { bk.file = null; bk.note = ck.reason; } else { bk.file = obj; bk.note = `Backup from ${String(obj.exportedAt || '').slice(0, 10) || 'an unknown date'} with ${ck.count.toLocaleString()} items.`; } }
    catch (e) { bk.file = null; bk.note = 'That file couldn\'t be read as a backup.'; }
    render();
  },
  'backup-cancel': () => { UI.bk = { erase: false, file: null, note: '' }; render(); },
  'backup-restore': async () => {
    const bk = UI.bk; if (!bk.file) return;
    const n = await task('backup', 'Restoring…', async () => restoreBackup(bk.file, bk.erase, (done, total) => { if (S.busy.backup) { S.busy.backup.label = `Restoring ${done} of ${total}…`; const el = $('.status-line span:nth-child(2)'); if (el) el.textContent = S.busy.backup.label; } }));
    if (n != null) { UI.bk = { erase: false, file: null, note: `Restored ${n.toLocaleString()} items.` }; toast('Backup restored.'); render(); }
  }
});

/* ===== views/main.js ===== */
/* Events and start-up. */
function setPath(obj, key, value) {
  const ks = key.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = value;
}
Object.assign(ACT, {
  'set': el => { setPath(UI, el.dataset.key, el.dataset.val); if (el.dataset.key === 'mat.tab') { UI.mat.results = null; UI.mat.note = ''; if (el.dataset.val === 'photo') ensureLimits(); } render(); },
  'toggle': el => { const ks = el.dataset.key.split('.'); let o = UI; for (const k of ks.slice(0, -1)) o = o[k] || (o[k] = {}); o[ks[ks.length - 1]] = !o[ks[ks.length - 1]]; render(); },
  'close-modal': () => closeModal(),
  'confirm-yes': () => { const fn = CONFIRM.fn; CONFIRM.fn = null; UI.modal = null; render(); if (fn) return fn(); },
  'copy': el => { const t = document.getElementById(el.dataset.target); if (t) copyText(t.value != null && /TEXTAREA|INPUT/.test(t.tagName) ? t.value : t.textContent, t); },
  'term': el => showTerm(el),
  'ai-stop': el => { const b = S.busy[el.dataset.key]; if (b && b.ctl) b.ctl.abort(); },
  'speak': el => { const k = el.dataset.key; if (SPEAKS[k] != null) Voice.toggle(SPEAKS[k], k); },
  'mic': el => Dict.click(el.dataset.target)
});
function ensureLimits() {
  if (S.limitsAsked || !S.sample || typeof S.sample.limits !== 'function') return;
  S.limitsAsked = true;
  S.sample.limits().then(l => { S.imagesOk = !!(l && l.images); if (l && l.images && l.images.maxCount) S.imageMax = Math.min(8, l.images.maxCount); render(); }).catch(() => { });
}
function runAct(name, el, ev) {
  const fn = ACT[name]; if (!fn) return;
  try { const r = fn(el, ev); if (r && r.catch) r.catch(e => { console.error('action', name, e); toast('That didn\'t work. Try again.', true); }); }
  catch (e) { console.error('action', name, e); toast('That didn\'t work. Try again.', true); }
}
document.addEventListener('click', ev => {
  Clock.last = Date.now();
  if (ev.target.id === 'modal') { closeModal(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) { if (!ev.target.closest('.pop')) hideTerm(); return; }
  if (el.tagName === 'A' || el.disabled) return;
  if (el.dataset.act !== 'term') hideTerm();
  runAct(el.dataset.act, el, ev);
});
document.addEventListener('input', ev => {
  Clock.last = Date.now();
  const el = ev.target, k = el.dataset && el.dataset.bind; if (!k) return;
  setPath(UI, k, el.type === 'checkbox' ? el.checked : el.value);
  if (el.id === 'f-add-text') { const n = $('#add-count'); if (n) n.textContent = el.value.length.toLocaleString(); }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset) return;
  if (el.dataset.actChange) runAct(el.dataset.actChange, el, ev);
  else if (el.dataset.bind && (el.type === 'checkbox' || el.type === 'date')) render();
});
document.addEventListener('keydown', ev => {
  Clock.last = Date.now();
  const el = ev.target;
  if (ev.key === 'Escape') { hideTerm(); if (UI.modal) closeModal(); else if (S.tutor.open) { S.tutor.open = false; Voice.stop(); render(); } return; }
  if (ev.key === 'Enter' && !ev.shiftKey && el.id === 'f-tutorIn') { ev.preventDefault(); tutorSend(); return; }
  if (ev.key === 'Enter' && el.id === 'f-game-input') { ev.preventDefault(); runAct('fill-check', el, ev); return; }
  if (ev.key === 'Enter' && el.id === 'f-mat-q') { ev.preventDefault(); const b = $('[data-act="mat-search"]'); if (b && !b.disabled) runAct('mat-search', b, ev); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute && el.getAttribute('role') === 'button' && el.dataset.act) { ev.preventDefault(); runAct(el.dataset.act, el, ev); }
});
window.addEventListener('hashchange', onRoute);

async function boot() {
  onRoute();
  const c = window.claude, names = ['db', 'sample', 'downloads', 'tts', 'dictation', 'mcp'];
  const got = await Promise.all(names.map(n => (c && typeof c.use === 'function' ? Promise.resolve().then(() => c.use(n)).catch(() => null) : null)));
  const [db, sample, downloads, tts, dictation, mcp] = got;
  S.store = db ? new DbStore(db) : new MemStore();
  S.memOnly = !db; S.sample = sample || null; S.downloads = downloads || null; S.tts = tts || null; S.dict = dictation || null; S.mcp = mcp || null;
  S.imagesOk = !!sample; S.imageMax = 5;
  if (S.tts && typeof S.tts.onState === 'function') { try { S.tts.onState(({ state }) => { if (state === 'idle' && Voice.mode === 'tts' && Voice.state !== 'idle') Voice.set('idle'); }); } catch (e) { } }
  const pending = new Set(WATCHED);
  const ready = () => { if (S.ready) return; S.ready = true; renderBanner(); onRoute(); render(); firstOpenToday(); };
  for (const col of WATCHED) {
    try { S.store.watch(col, m => { applySnapshot(col, m); if (pending.delete(col) && !pending.size) ready(); else if (S.ready) softRender(); }); }
    catch (e) { pending.delete(col); }
  }
  setTimeout(ready, 8000);
  setInterval(() => { tickTest(); tickGame(); }, 1000);
  setInterval(tickClock, 30000);
}
/* A day with nothing due still keeps the streak once you have started studying. */
function firstOpenToday() {
  const d = dayRec(); if (d.done || !activeCards().some(c => c.fsrs && c.fsrs.reps)) return;
  if (todayPlan({ restDay: false }).dueTotal === 0) bumpMeta((m, day) => { day.done = true; });
}
boot();
